name: Publish one reviewed TechTinkerer guide weekly
on:
  schedule:
    # Mondays 14:17 UTC (09:17 EST / 10:17 EDT).
    - cron: '17 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tech-tinkerer-reviewed-content
  cancel-in-progress: false

jobs:
  publish-reviewed-article:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote no more than one reviewed queue article
        run: python3 -m scripts.weekly_release --apply

      - name: Run complete source tests before any commit
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m src.builder --mode preview
          python3 -m src.qa
          grep -q 'noindex' dist/index.html
          grep -q 'Disallow: /' dist/robots.txt

      - name: Publish source changes to GitHub
        run: |
          git add content/articles.json content/publish-queue.json
          if git diff --cached --quiet; then
            echo 'No reviewed content ready. No commit or Netlify deploy requested.'
            exit 0
          fi
          git config user.name 'TechTinkerer Publishing Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'content: publish one verified weekly guide'
          git push origin HEAD:main
