name: One-time import of approved article thumbnails
on:
  push:
    branches: [feat/card-first-homepage]
    paths: [.github/workflows/one-time-import-card-images.yml]
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing
        run: python -m pip install "Pillow>=11,<13"
      - name: Download source images and store optimized local assets
        run: |
          python - <<'PY'
          import io
          import json
          import logging
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps, ImageFilter

          logging.basicConfig(level=logging.INFO)
          root = Path("assets/thumbnails")
          root.mkdir(parents=True, exist_ok=True)
          manifest = json.loads(Path("content/thumbnail-import-sources.json").read_text())
          if manifest.get("schema_version") != 1 or len(manifest.get("items", [])) != 3:
              raise ValueError("Expected exactly three curated image source records")
          for item in manifest["items"]:
              try:
                  url = item["temporary_url"]
                  name = item["file"]
                  if urlsplit(url).hostname != "media.canva.com" or not name.endswith(".webp"):
                      raise ValueError("Image source and target must be allowlisted")
                  if Path(name).name != name:
                      raise ValueError("Image target is not a plain filename")
                  req = Request(url, headers={"User-Agent": "TechTinkererHQ-ImageImport/1.0"})
                  with urlopen(req, timeout=25) as response:
                      if "image/" not in response.headers.get("Content-Type", ""):
                          raise ValueError("Source did not return image content")
                      image_bytes = response.read(8_000_001)
                  if len(image_bytes) > 8_000_000:
                      raise ValueError("Image exceeds size cap")
                  with Image.open(io.BytesIO(image_bytes)) as raw:
                      if raw.width < 180 or raw.height < 90:
                          raise ValueError("Source image too small")
                      image = ImageOps.fit(raw.convert("RGB"), (760, 380), method=Image.Resampling.LANCZOS)
                      image = image.filter(ImageFilter.UnsharpMask(radius=1.1, percent=85, threshold=3))
                      image.save(root / name, "WEBP", quality=84, method=6)
                  logging.info("Imported %s (%d bytes)", name, (root / name).stat().st_size)
              except Exception:
                  logging.exception("Image import failed: %s", item.get("file"))
                  raise
          PY
      - name: Commit three local website image assets
        run: |
          git config user.name 'TechTinkerer Image Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/thumbnails/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: store three article-specific thumbnails"
          git push origin "HEAD:$GITHUB_REF_NAME"
